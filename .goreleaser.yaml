version: 2

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build
    - go mod tidy

builds:
  - id: quizdock
    main: ./cmd/quizdock
    binary: quizdock
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
